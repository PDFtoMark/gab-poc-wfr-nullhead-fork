name: Watcher NullHead
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: dump payload
        run: |
          jq -c '{event:.workflow_run.event,name:.workflow_run.name,head_branch:.workflow_run.head_branch,head_sha:.workflow_run.head_sha,head_repo:.workflow_run.head_repository,pull_requests:.workflow_run.pull_requests}' "$GITHUB_EVENT_PATH"
      - name: sonar-shape checkout
        id: co
        continue-on-error: true
        uses: actions/checkout@v3
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: inspect
        run: |
          echo "co_outcome=${{ steps.co.outcome }}"
          echo "HEAD=$(git rev-parse HEAD 2>/dev/null || echo none)"
          ls -la | head -20
          if [ -f marker.txt ]; then echo "MARKER=$(cat marker.txt)"; else echo "MARKER=absent"; fi
